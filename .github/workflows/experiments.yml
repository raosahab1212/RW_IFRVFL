name: experiments

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment to run
        type: choice
        options: [e1, e7, e3, e4_label, e4_feature, e4_label_abl, e4_feature_abl]
        default: e1
      shards:
        description: Number of parallel jobs (max 256; 20 run at once on the free plan)
        default: "60"
      datasets:
        description: Optional comma-separated dataset filter
        default: ""
      models:
        description: Optional comma-separated model filter
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: python3 -c "import json; print('shards=' + json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: lscpu | head -20
      - run: >
          python -u run_shard.py ${{ inputs.experiment }} ${{ matrix.shard }} ${{ inputs.shards }}
          --slots "$(nproc)" --datasets "${{ inputs.datasets }}" --models "${{ inputs.models }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: res-${{ inputs.experiment }}-${{ matrix.shard }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90

  merge:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: res-${{ inputs.experiment }}-*
          path: results
          merge-multiple: true
      - run: python merge.py results
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.experiment }}
          path: results/
          retention-days: 90
